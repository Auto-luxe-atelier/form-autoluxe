<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publier Partout — Auto Luxe Atelier</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap');

  :root {
    --gold: #ffd000;
    --bg: #0a0a0a;
    --panel: #161616;
    --border: #2a2a2a;
    --text: #f2f2f2;
    --muted: #8a8a8a;
    --ok: #3ecf6a;
    --err: #ff5c5c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  header .eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--gold);
    margin-bottom: 6px;
  }

  header h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 34px;
    margin: 0;
    letter-spacing: 0.01em;
  }

  header p {
    color: var(--muted);
    font-size: 14px;
    margin: 8px 0 0;
  }

  form {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
  }

  .drop {
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
    position: relative;
  }

  .drop.has-file { border-color: var(--gold); background: rgba(255,208,0,0.05); }

  .drop input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .drop .icon { font-size: 30px; margin-bottom: 8px; }
  .drop .label { font-size: 15px; font-weight: 500; }
  .drop .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  textarea {
    width: 100%;
    margin-top: 16px;
    background: #0f0f0f;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    resize: vertical;
    min-height: 64px;
  }

  textarea:focus, .drop:focus-within { outline: 2px solid var(--gold); outline-offset: 1px; }

  button {
    width: 100%;
    margin-top: 18px;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: var(--gold);
    color: #1a1400;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.02em;
    cursor: pointer;
  }

  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .status {
    margin-top: 16px;
    font-size: 14px;
    text-align: center;
    min-height: 20px;
  }

  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .status.pending { color: var(--muted); }

  .targets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 16px;
    justify-content: center;
  }

  .chip {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 0.03em;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .chip.live { border-color: var(--gold); color: var(--gold); }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Auto Luxe Atelier</div>
  <h1>Publier Partout</h1>
  <p>Un fichier. Un clic. Toutes les plateformes.</p>
</header>

<form id="publishForm">
  <label class="drop" id="dropZone">
    <input type="file" id="videoInput" name="video" accept="video/*,image/*" required>
    <div class="icon">🎬</div>
    <div class="label" id="dropLabel">Choisir une vidéo ou une photo</div>
    <div class="sub" id="dropSub">Depuis la galerie ou la caméra</div>
  </label>

  <textarea id="caption" name="caption" placeholder="Légende (véhicule, service...)"></textarea>

  <button type="submit" id="submitBtn">Publier partout</button>

  <div class="status" id="status"></div>

  <div class="targets">
    <span class="chip live">Facebook</span>
    <span class="chip">Stories FB</span>
    <span class="chip">Instagram</span>
    <span class="chip">Stories IG</span>
    <span class="chip">TikTok</span>
    <span class="chip">YouTube</span>
  </div>
</form>

<script>
  const WEBHOOK_URL = 'https://n8n-hetzner.duckdns.org/webhook/publier-partout';

  const form = document.getElementById('publishForm');
  const videoInput = document.getElementById('videoInput');
  const dropZone = document.getElementById('dropZone');
  const dropLabel = document.getElementById('dropLabel');
  const dropSub = document.getElementById('dropSub');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  videoInput.addEventListener('change', () => {
    const file = videoInput.files[0];
    if (file) {
      dropZone.classList.add('has-file');
      dropLabel.textContent = file.name;
      dropSub.textContent = (file.size / (1024 * 1024)).toFixed(1) + ' Mo';
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const file = videoInput.files[0];
    if (!file) return;

    submitBtn.disabled = true;
    statusEl.className = 'status pending';
    statusEl.textContent = 'Envoi en cours...';

    const formData = new FormData();
    formData.append('video', file, file.name);
    formData.append('caption', document.getElementById('caption').value);

    try {
      const res = await fetch(WEBHOOK_URL, { method: 'POST', body: formData });
      if (!res.ok) throw new Error('Réponse ' + res.status);
      statusEl.className = 'status ok';
      statusEl.textContent = '✓ Publié avec succès.';
      form.reset();
      dropZone.classList.remove('has-file');
      dropLabel.textContent = 'Choisir une vidéo ou une photo';
      dropSub.textContent = 'Depuis la galerie ou la caméra';
    } catch (err) {
      statusEl.className = 'status err';
      statusEl.textContent = 'Échec de l\'envoi — réessaie.';
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
